<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning agent - review previous screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Tokens copied from the learning-activity prototype */
  :root {
    --background: #121212;
    --tone-1: #fff;
    --tone-6: #383838;
    --w-10: rgba(255, 255, 255, 0.1);
    --w-20: rgba(255, 255, 255, 0.2);
    --w-30: rgba(255, 255, 255, 0.3);
    --w-60: rgba(255, 255, 255, 0.6);
    --w-80: rgba(255, 255, 255, 0.8);
    --w-100: #fff;
    --b-20: rgba(0, 0, 0, 0.2);
    --b-50: rgba(0, 0, 0, 0.5);
    --b-60: rgba(0, 0, 0, 0.6);
    --primary: #006efa;
    --primary-glow: rgba(0, 110, 250, 0.55);
    --danger: #ca1c2d;
    --success: #23803a;
    --success-bright: #3fbf62;
    --roundness-1: 8px;
    --roundness-2: 8px;
    --roundness-3: 16px;
    --bar-h: 144px;
    --product-header-h: 64px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--background); font-family: Lato, sans-serif; -webkit-font-smoothing: antialiased; color: var(--tone-1); }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  svg { display: block; }

  .frame { position: relative; width: 100vw; height: 100vh; min-width: 1280px; min-height: 760px; overflow: hidden; isolation: isolate; }

  /* Ambient background (static version of the prototype's mesh) */
  .mesh { position: absolute; inset: 0; z-index: -1; background:
      radial-gradient(60vmax 60vmax at 8% 95%, rgba(0, 110, 250, 0.42), transparent 70%),
      radial-gradient(55vmax 55vmax at 92% 88%, rgba(125, 70, 255, 0.38), transparent 70%),
      radial-gradient(45vmax 45vmax at 100% 40%, rgba(255, 70, 170, 0.16), transparent 70%),
      radial-gradient(45vmax 45vmax at 5% 5%, rgba(0, 150, 255, 0.22), transparent 70%),
      radial-gradient(45vmax 45vmax at 95% 5%, rgba(190, 80, 255, 0.22), transparent 70%),
      rgb(18, 20, 30); }

  /* ================= Navigation bar (product header) ================= */
  .product-header { position: absolute; top: 0; left: 0; right: 0; z-index: 5; height: var(--product-header-h); display: flex; align-items: center; justify-content: center; gap: 16px; padding: 0 24px; }

  .nav-arrow { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--w-10); color: var(--w-100); transition: background .15s, opacity .15s; }
  .nav-arrow:hover:not(:disabled) { background: var(--w-30); }
  .nav-arrow:disabled { opacity: .3; cursor: not-allowed; }

  .steps { display: flex; align-items: center; gap: 8px; width: 760px; margin: 0; padding: 0; list-style: none; }
  .milestone { flex: none; width: 16px; height: 16px; border-radius: 50%; background: var(--w-10); }
  .milestone.done { background: var(--primary); }
  .milestone.current { box-shadow: inset 0 0 0 2px var(--primary); }

  /* One segment per screen between the milestone dots */
  .screens { flex: 1; display: flex; gap: 4px; align-items: center; }
  .screen { position: relative; flex: 1; height: 20px; display: flex; align-items: center; }
  .screen::before { content: ""; width: 100%; height: 4px; border-radius: 4px; background: var(--w-10); transition: height .15s, background .15s, box-shadow .15s; }
  .screen.done::before { background: var(--primary); }
  .screen.done:hover::before, .screen.current:hover::before { height: 8px; }
  .screen.current::before { background: var(--w-60); }
  .screen.current::after { /* "you are here" marker under the current screen */
    content: ""; position: absolute; left: 50%; top: 100%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--w-100); animation: here 1.6s ease-in-out infinite; }
  @keyframes here { 50% { opacity: .35; } }
  .screen.viewing::before { height: 8px; box-shadow: 0 0 12px 2px var(--primary-glow); }
  .screen.locked { cursor: not-allowed; }

  /* Hover card for a screen */
  .tip { position: absolute; top: calc(100% + 12px); left: 50%; transform: translate(-50%, 4px); width: max-content; max-width: 260px; padding: 10px 12px; border-radius: var(--roundness-2); background: rgba(20, 22, 32, .92); backdrop-filter: blur(16px); box-shadow: 0 8px 24px rgba(0,0,0,.4); text-align: left; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .15s, transform .15s, visibility .15s; z-index: 10; }
  .screen:hover .tip, .screen:focus-visible .tip { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
  .tip-type { display: block; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--w-60); }
  .tip-title { display: block; margin-top: 4px; font-size: 14px; font-weight: 700; line-height: 1.3; }
  .tip-status { display: flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--w-80); }
  .screen:focus-visible { outline: 2px solid var(--w-100); outline-offset: 2px; border-radius: 4px; }

  /* ================= Canvas: card + avatar ================= */
  .canvas { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 16px; padding: calc(var(--product-header-h) + 24px) 48px calc(var(--bar-h) + 12px); }
  .card { width: 924px; height: 100%; max-height: 600px; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; padding: 28px 44px 24px; border-radius: var(--roundness-3); background: var(--w-10); overflow: hidden; position: relative; }
  .card-main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
  .eyebrow { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--w-60); }
  h1 { margin: 0; font-size: 26px; font-weight: 700; line-height: 1.25; }
  .media { flex: 1; min-height: 80px; display: flex; gap: 24px; }
  .media img.pic { height: auto; max-height: 170px; aspect-ratio: 1448 / 1086; object-fit: cover; border-radius: var(--roundness-2); }

  /* Quiz answers */
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .answer { display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 10px 16px; border-radius: var(--roundness-2); background: var(--w-20); text-align: left; transition: background .15s, opacity .15s; }
  .answer:hover { background: var(--w-30); }
  .answer[aria-checked="true"] { box-shadow: inset 0 0 0 1px var(--w-100); }
  .pill { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--roundness-1); box-shadow: inset 0 0 0 1px var(--w-100); font-size: 16px; font-weight: 700; }
  .answer[aria-checked="true"] .pill { background: #fff; color: #000; box-shadow: none; }
  .answer .label { flex: 1; font-size: 18px; }

  /* Review: read-only answers */
  .review .answer { cursor: default; }
  .review .answer:hover { background: var(--w-20); }
  .review .answer.dim { opacity: .45; }
  .review .answers.no-answer .answer { opacity: .7; }
  .answer.mine.right { box-shadow: inset 0 0 0 2px var(--success-bright); background: rgba(63, 191, 98, .16); }

  /* Text answers */
  .input-box { width: 100%; padding: 24px 28px; border: 0; border-radius: var(--roundness-2); background: var(--b-20); color: var(--w-100); font: inherit; font-size: 20px; line-height: 1.5; resize: none; outline: none; }
  .input-box::placeholder { color: var(--w-80); }
  .media .input-box { flex: 1; height: 100%; }
  /* Answered open question: a disabled field holding the student's answer */
  .input-box:disabled { opacity: 1; color: var(--w-80); -webkit-text-fill-color: var(--w-80); background: rgba(0, 0, 0, .12); cursor: not-allowed; }

  .reading-text { flex: 1; padding: 24px 28px; border-radius: var(--roundness-2); background: var(--b-20); font-size: 18px; line-height: 1.55; overflow: hidden; }
  .reading-text p { margin: 0 0 6px; }
  .reading-text .rt-title { font-weight: 700; margin-bottom: 10px; }

  /* Video screen: same card as in the lesson (copied from .video-card / .video-label) */
  .card.video { width: 954px; height: 540px; flex: none; padding: 0; gap: 0; border-radius: var(--roundness-3); background: #000; position: relative; }
  .card.video .poster { width: 100%; height: 100%; object-fit: cover; }
  .card.video .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; background: rgba(80, 80, 80, .75); }
  .video-label { position: absolute; left: 32px; bottom: 32px; display: flex; align-items: center; height: 48px; padding: 0 16px; border-radius: var(--roundness-1); background: var(--b-60); font-size: 16px; font-weight: 700; white-space: nowrap; }
  .canvas.watch { padding-inline: 32px; }
  .canvas.watch .avatar { width: 406px; height: 541px; }

  /* Card footer: the live screen's CTA (review screens have none) */
  .card-foot { display: flex; align-items: center; gap: 16px; min-height: 56px; }
  .cta-button { display: flex; align-items: center; gap: 16px; height: 56px; padding: 12px 20px; border-radius: var(--roundness-2); background: var(--primary); font-size: 18px; font-weight: 700; color: #fff; }
  .answered { display: flex; align-items: center; gap: 12px; height: 56px; font-size: 18px; font-weight: 700; color: var(--w-80); }
  .answered-ico { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--success); }
  .cta-button:disabled { background: transparent; box-shadow: inset 0 0 0 1px #ccc; color: #ccc; cursor: not-allowed; }

  /* Avatar */
  .avatar { position: relative; flex: none; width: 300px; height: 400px; border-radius: var(--roundness-3); overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; transition: filter .3s; }
  .avatar .speaking { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; height: 40px; padding: 0 16px; border-radius: var(--roundness-2); background: var(--b-60); backdrop-filter: blur(16px); font-size: 16px; font-weight: 700; white-space: nowrap; }

  /* ================= Bottom bar ================= */
  .bottom-bar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--bar-h); display: flex; flex-direction: column; align-items: center; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.2)); }
  .message { height: 48px; display: flex; align-items: center; font-size: 16px; font-weight: 700; font-style: italic; }
  .controls { position: relative; width: 100%; height: 96px; }
  .mic-pill { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 4px; height: 56px; padding: 16px; border-radius: 56px; background: var(--b-60); box-shadow: inset 0 0 0 2px var(--primary), 0 0 56px 0 rgba(0,110,250,.5); transition: opacity .3s, box-shadow .3s; }
  .add-context { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; }
  .end-pill { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 4px; height: 32px; padding: 8px 6px 8px 10px; border-radius: 8px; background: var(--danger); font-size: 14px; font-weight: 700; }

  /* Screen change animation */
  .card.enter { animation: enter .35s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  /* Confetti canvas */
  #confetti-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 90; }

  /* Milestone circle at checkpoint (transition) */
  .milestone.viewing { box-shadow: 0 0 16px 3px var(--primary-glow); background: var(--w-100); }

  /* Skipped step indicator: clean hollow pill, no text */
  .screen.skipped::before { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.4); }
  .screen.skipped:hover::before { box-shadow: inset 0 0 0 1.5px var(--w-100); height: 8px; }

  /* Card footer: back button on the left, action buttons on the right */
  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; width: 100%; flex: none; margin-top: auto; padding-top: 8px; }
  .card-foot-right { display: flex; align-items: center; gap: 16px; }

  /* Back arrow button inside each card - exact same 56px height and styling as cta-button */
  .card-back-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    height: 56px;
    padding: 12px 20px;
    border-radius: var(--roundness-2);
    background: var(--w-10);
    border: 1px solid var(--w-10);
    color: var(--w-80);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .card-back-btn:hover:not(:disabled) {
    background: var(--w-20);
    color: var(--w-100);
  }
  .card-back-btn:disabled {
    opacity: 0.25;
    cursor: not-allowed;
  }

  /* Clear visual-only Review Mode: unmistakable completed/locked state WITHOUT text */
  .card.review {
    border: 1px solid rgba(63, 191, 98, 0.4) !important;
    box-shadow: 0 0 32px -4px rgba(63, 191, 98, 0.18), 0 20px 48px rgba(0, 0, 0, 0.45);
    background: linear-gradient(180deg, rgba(63, 191, 98, 0.05) 0%, rgba(255, 255, 255, 0.06) 100%) !important;
    position: relative;
  }
  .card.review .card-main {
    pointer-events: none;
    user-select: none;
  }
  .card.review .answer {
    cursor: default;
  }
  .card.review .answer:not(.mine) {
    opacity: 0.22;
    filter: grayscale(0.8);
  }
  .card.review .answer.mine.right {
    box-shadow: inset 0 0 0 2px var(--success-bright), 0 0 20px rgba(63, 191, 98, 0.25);
    background: rgba(63, 191, 98, 0.22);
    opacity: 1 !important;
  }
  .card.review .answer.mine.right .pill {
    background: var(--success-bright);
    color: #000;
    box-shadow: none;
  }
  .card.review .input-box {
    background: rgba(0, 0, 0, 0.25);
    border: 1.5px solid rgba(63, 191, 98, 0.45);
    box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.4), 0 0 16px rgba(63, 191, 98, 0.12);
    color: var(--w-100);
    cursor: default;
  }

  /* Non-textual check stamp in the corner of completed cards */
  .review-stamp {
    position: absolute;
    top: 36px;
    right: 44px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(63, 191, 98, 0.2);
    border: 1.5px solid var(--success-bright);
    display: grid;
    place-items: center;
    color: var(--success-bright);
    box-shadow: 0 0 16px rgba(63, 191, 98, 0.35);
    pointer-events: none;
  }

  /* Instant Correct Feedback Pulse */
  @keyframes correctPulse {
    0% { transform: scale(1); box-shadow: inset 0 0 0 2px var(--success-bright), 0 0 0 0 rgba(63, 191, 98, 0.7); }
    50% { transform: scale(1.02); box-shadow: inset 0 0 0 3px var(--success-bright), 0 0 24px 6px rgba(63, 191, 98, 0.6); }
    100% { transform: scale(1); box-shadow: inset 0 0 0 2px var(--success-bright), 0 0 12px 2px rgba(63, 191, 98, 0.4); }
  }
  .answer.just-correct {
    animation: correctPulse 0.6s ease-out forwards;
    background: rgba(63, 191, 98, 0.25) !important;
  }
  .input-box.just-correct {
    border-color: var(--success-bright) !important;
    box-shadow: 0 0 16px var(--success-bright);
  }

  /* Interactive selection for active quiz */
  .answer.selected { box-shadow: inset 0 0 0 2px var(--primary); background: var(--w-30); }
  .answer.selected .pill { background: var(--primary); color: #fff; box-shadow: none; }
  .answer.wrong { box-shadow: inset 0 0 0 2px var(--danger); background: rgba(202, 28, 45, 0.2); }
  .answer.wrong .pill { background: var(--danger); color: #fff; box-shadow: none; }

  /* Streamlined, minimal Milestone Transition Screen */
  .milestone-summary { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 20px; width: 100%; height: 100%; }
  .milestone-summary h1 { font-size: 34px; font-weight: 700; margin: 0; line-height: 1.2; color: var(--w-100); }
  .milestone-summary p.summary-desc { font-size: 18px; line-height: 1.5; color: var(--w-80); margin: 0; max-width: 580px; }
  
  .summary-actions { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
  .secondary-btn { display: flex; align-items: center; gap: 10px; height: 56px; padding: 12px 24px; border-radius: var(--roundness-2); background: var(--w-10); border: 1px solid var(--w-20); font-size: 18px; font-weight: 700; color: var(--w-80); transition: background .15s, color .15s; }
  .secondary-btn:hover { background: var(--w-20); color: var(--w-100); }
  
  .skip-link { background: none; border: none; color: var(--w-60); font-size: 15px; font-weight: 700; cursor: pointer; padding: 8px 12px; transition: color .15s; }
  .skip-link:hover { color: var(--w-100); }

  /* Instruction Hebrew Translation Banner */
  .instruction-translation {
    margin-top: -12px;
    margin-bottom: 6px;
    padding: 10px 16px;
    background: rgba(0, 110, 250, 0.12);
    border: none;
    border-radius: var(--roundness-1);
    font-family: 'Rubik', system-ui, sans-serif;
    font-size: 15px;
    color: var(--w-100);
    line-height: 1.4;
    direction: rtl;
    text-align: right;
  }

  /* Prototype Version Switcher Floating Panel */
  .proto-switcher {
    position: fixed;
    top: 12px;
    left: 16px;
    z-index: 100;
    width: 280px;
    background: rgba(18, 20, 30, 0.94);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: var(--roundness-2);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    font-family: Lato, sans-serif;
    transition: all .2s ease;
  }
  .proto-switcher-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.06);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  .proto-switcher-header:active {
    cursor: grabbing;
  }
  .proto-switcher.is-dragging {
    transition: none !important;
    opacity: 0.95;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
  }
  .proto-switcher-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--w-100);
  }
  .proto-switcher-toggle {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border-radius: 4px;
    color: var(--w-60);
    transition: transform .2s ease;
  }
  .proto-switcher.is-collapsed .proto-switcher-body { display: none; }
  .proto-switcher.is-collapsed .proto-switcher-toggle { transform: rotate(180deg); }
  .proto-switcher-body {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .proto-switcher-desc {
    margin: 0 0 2px;
    font-size: 12px;
    color: var(--w-60);
    line-height: 1.4;
  }
  .proto-option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    border-radius: var(--roundness-1);
    background: var(--w-10);
    border: 1px solid var(--w-10);
    cursor: pointer;
    transition: all .15s ease;
  }
  .proto-option:hover {
    background: var(--w-20);
    border-color: var(--w-20);
  }
  .proto-option.active {
    background: rgba(0, 110, 250, 0.18);
    border-color: var(--primary);
  }
  .proto-option input {
    margin-top: 3px;
    accent-color: var(--primary);
    cursor: pointer;
  }
  .proto-option-content {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .proto-option-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--w-100);
  }
  .proto-option-sub {
    font-size: 11px;
    color: var(--w-60);
  }
</style>

</head>
<body>
<div class="frame" id="frame">
  <div class="mesh" aria-hidden="true"></div>
  <canvas id="confetti-canvas"></canvas>
  <aside class="proto-switcher" id="proto-switcher" aria-label="Prototype Version Switcher">
    <div class="proto-switcher-header" id="proto-switcher-header">
      <div class="proto-switcher-title" title="Drag to move panel">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="opacity:0.5;margin-right:2px"><circle cx="9" cy="5" r="1.8" fill="currentColor"/><circle cx="15" cy="5" r="1.8" fill="currentColor"/><circle cx="9" cy="12" r="1.8" fill="currentColor"/><circle cx="15" cy="12" r="1.8" fill="currentColor"/><circle cx="9" cy="19" r="1.8" fill="currentColor"/><circle cx="15" cy="19" r="1.8" fill="currentColor"/></svg>
        <span>Prototype Version</span>
      </div>
      <button class="proto-switcher-toggle" id="proto-toggle-btn" type="button" aria-label="Toggle switcher">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="proto-switcher-body" id="proto-switcher-body">
      <p class="proto-switcher-desc">Select instruction scaffolding mode:</p>
      <label class="proto-option active" id="opt-label-v1">
        <input type="radio" name="proto-mode" value="en" id="proto-mode-en" checked>
        <div class="proto-option-content">
          <span class="proto-option-title">1. English Only</span>
          <span class="proto-option-sub">Original full English immersion</span>
        </div>
      </label>
      <label class="proto-option" id="opt-label-v2">
        <input type="radio" name="proto-mode" value="he" id="proto-mode-he">

      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var ICON = {
    check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    lock: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 018 0v3" stroke="currentColor" stroke-width="2"/></svg>',
    dot: '<span style="width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block"></span>',
    playBig: '<svg width="40" height="40" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13a1 1 0 001.5.86l10.2-6.5a1 1 0 000-1.72L9.5 4.64A1 1 0 008 5.5z"/></svg>',
    arrow: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  function getMilestoneStatus(mi) {
    var m = milestones[mi];
    if (!m || !m.screens.length) return { total: 0, completed: 0, skipped: 0, isAllCompleted: true, firstSkippedIndex: null };
    var total = m.screens.length;
    var completed = 0;
    var firstSkipped = null;
    m.screens.forEach(function (s) {
      if (s.completed) {
        completed++;
      } else {
        if (firstSkipped === null) firstSkipped = s.index;
      }
    });
    return {
      total: total,
      completed: completed,
      skipped: total - completed,
      isAllCompleted: (completed === total),
      firstSkippedIndex: firstSkipped
    };
  }

  function buildSteps() {
    stepsEl.innerHTML = '';

    milestones.forEach(function (m, mi) {
      var dot = document.createElement('li');

      var isViewingThisDot = (viewingMode === 'milestone' && viewingCheckpointDot === mi);
      var isDone = (mi <= unlockedMilestone && mi !== viewingCheckpointDot);
      var isCurrent = (mi === unlockedMilestone && viewingMode !== 'milestone');

      var dotCls = 'milestone';
      if (isViewingThisDot) {
        dotCls += ' viewing';
      } else if (isDone) {
        dotCls += ' done';
      } else if (isCurrent) {
        dotCls += ' current';
      }

      dot.className = dotCls;
      dot.innerHTML = '<span class="sr-only">Milestone ' + (mi + 1) + ': ' + esc(m.title) + '</span>';

      if (mi <= unlockedMilestone) {
        dot.style.cursor = 'pointer';
        dot.addEventListener('click', function () {
          if (mi === 0 && m.screens.length > 0) {
            goToScreen(m.screens[0].index);
          } else if (mi > 0) {
            viewingMode = 'milestone';
            checkpointFinishedMilestone = mi - 1;
            viewingCheckpointDot = mi;
            render();
          }
        });
      }
      stepsEl.appendChild(dot);

      if (!m.screens.length) return;

      var group = document.createElement('li');
      group.className = 'screens';

      m.screens.forEach(function (s) {
        var b = document.createElement('button');
        var isLocked = (s.m > unlockedMilestone);
        var isViewingThisSubstep = (viewingMode === 'screen' && s.index === viewingScreenIndex);

        var state = 'locked';
        if (!isLocked) {
          if (isViewingThisSubstep) {
            state = 'current viewing';
            if (s.completed) state += ' done';
          } else if (s.completed) {
            state = 'done';
          } else if (s.skipped) {
            state = 'skipped';
          } else {
            state = '';
          }
        }

        b.className = ('screen ' + state).trim();
        b.dataset.index = s.index;

        if (state === 'locked') {
          b.setAttribute('aria-disabled', 'true');
          b.innerHTML = '<span class="tip"><span class="tip-type">Milestone ' + (mi + 1) + '</span><span class="tip-status">' + ICON.lock + ' Not reached yet</span></span>';
        } else {
          var statusText = s.completed ? (ICON.check + ' Answered') : (isViewingThisSubstep ? 'Viewing now' : (s.skipped ? 'Skipped' : 'Not answered'));
          b.innerHTML = '<span class="tip"><span class="tip-type">' + esc(s.kind) + '</span><span class="tip-title">' + esc(s.title) + '</span><span class="tip-status">' + statusText + '</span></span>';
        }

        b.setAttribute('aria-label', s.kind + (isLocked ? ', not reached yet' : ': ' + s.title));
        if (isViewingThisSubstep) b.setAttribute('aria-current', 'step');

        if (!isLocked) {
          b.addEventListener('click', function () {
            goToScreen(s.index);
          });
        }
        group.appendChild(b);
      });

      stepsEl.appendChild(group);
    });
  }

  function quizHTML(s, isReview) {
    var html = '<div class="answers" role="radiogroup">';
    s.options.forEach(function (o, i) {
      var cls = 'answer';
      if (isReview && s.answer != null) {
        if (i === s.answer) {
          cls += ' mine right';
        } else {
          cls += ' dim';
        }
      } else if (!isReview && currentSelectedQuiz === i) {
        cls += ' selected';
      }

      var ariaChecked = isReview ? (i === s.answer) : (currentSelectedQuiz === i);
      var attrDisabled = isReview ? ' aria-disabled="true" tabindex="-1"' : '';

      html += '<button type="button" class="' + cls + '" data-quiz-opt="' + i + '" role="radio" aria-checked="' + ariaChecked + '"' + attrDisabled + '>' +
        '<span class="pill">' + 'ABCD'[i] + '</span><span class="label">' + esc(o) + '</span></button>';
    });
    return html + '</div>';
  }

  function render() {
    buildSteps();

    if (viewingMode === 'milestone') {
      renderTransitionCheckpoint();
      return;
    }

    var s = screens[viewingScreenIndex];
    if (!s) return;

    var isReview = (s.completed === true);

    frame.classList.toggle('reviewing', isReview);
    card.className = 'card enter' + (isReview ? ' review' : '') + (s.type === 'watch' ? ' video' : '');
    card.parentNode.classList.toggle('watch', s.type === 'watch');
    void card.offsetWidth;

    var m = milestones[s.m];
    var main = '<p class="eyebrow">Milestone ' + (s.m + 1) + ' · ' + esc(s.kind) + '</p>';
    var foot = '';

    // Hebrew instruction translation scaffolding (only when protoMode === 'he')
    var transHTML = '';
    if (protoMode === 'he' && s.transHe) {
      transHTML = '<div class="instruction-translation">' + esc(s.transHe) + '</div>';
    }

    if (s.type === 'watch') {
      card.innerHTML = '<img class="poster" id="video-poster-img" src="' + POSTER + '" alt="' + esc(s.title) + '">' +
        '<button type="button" class="play" id="watch-play-btn" aria-label="Play video">' + ICON.playBig + '</button>' +
        '<p class="video-label">Watch clip</p>';
      
      setupWatch(s, isReview);
      afterRender(s, isReview);
      return;
    } else if (s.type === 'read') {
      main += '<h1>' + esc(s.title) + '</h1>' + transHTML + '<div class="media"><div class="reading-text"><p class="rt-title">The Mystery of the Missing Lunch</p><p>Mia opened her backpack and noticed something strange.</p><p>“My lunch is missing!” she said.</p><p>Her friend Noah asked, “Did you check everywhere?”</p><p>They looked in the classroom, the library, and the playground.</p></div><img class="pic" src="' + IMG + '" alt=""></div>';
      if (!isReview) {
        foot = '<button type="button" class="skip-link" id="skip-screen-btn">Skip for now</button>' +
               '<button type="button" class="cta-button" id="confirm-read-btn">Continue ' + ICON.arrow + '</button>';
      }
    } else if (s.type === 'quiz') {
      main += '<h1>' + esc(s.title) + '</h1>' + transHTML + '<div class="media"><img class="pic" src="' + IMG + '" alt=""></div>' + quizHTML(s, isReview);
      if (!isReview) {
        var disabledAttr = (currentSelectedQuiz === null) ? ' disabled' : '';
        foot = '<button type="button" class="skip-link" id="skip-screen-btn">Skip for now</button>' +
               '<button type="button" class="cta-button" id="confirm-quiz-btn"' + disabledAttr + '>Confirm answer ' + ICON.arrow + '</button>';
      }
    } else if (s.type === 'input') {
      var val = isReview ? esc(s.answer || '') : esc(currentTypedText);
      main += '<h1>' + esc(s.title) + '</h1>' + transHTML + '<div class="media">' +
        (isReview ? '<textarea class="input-box" disabled aria-label="Your answer">' + val + '</textarea>'
                  : '<textarea class="input-box" id="active-textarea" placeholder="Type your answer here...">' + val + '</textarea>') +
        '<img class="pic" src="' + IMG + '" alt=""></div>';
      if (!isReview) {
        var disabledAttr = (currentTypedText.trim().length === 0) ? ' disabled' : '';
        foot = '<button type="button" class="skip-link" id="skip-screen-btn">Skip for now</button>' +
               '<button type="button" class="cta-button" id="confirm-input-btn"' + disabledAttr + '>Confirm answer ' + ICON.arrow + '</button>';
      }
    } else if (s.type === 'short') {
      var val = isReview ? esc(s.answer || '') : esc(currentTypedText);
      main += '<h1>' + esc(s.title) + '</h1>' + transHTML + '<div class="media"><img class="pic" src="' + IMG + '" alt=""></div>' +
        (isReview ? '<input class="input-box" disabled aria-label="Your answer" value="' + val + '">'
                  : '<input class="input-box" id="active-short" placeholder="Type a short sentence..." aria-label="Your answer" value="' + val + '">');
      if (!isReview) {
        var disabledAttr = (currentTypedText.trim().length === 0) ? ' disabled' : '';
        foot = '<button type="button" class="skip-link" id="skip-screen-btn">Skip for now</button>' +
               '<button type="button" class="cta-button" id="confirm-short-btn"' + disabledAttr + '>Confirm answer ' + ICON.arrow + '</button>';
      }
    }

    if (isReview) {
      // In review mode: no text labels. Only navigation buttons are clickable!
      foot = '<button type="button" class="cta-button" id="review-continue-btn">Continue ' + ICON.arrow + '</button>';
    }

    var backDisabled = (viewingScreenIndex === 0 && viewingMode === 'screen') ? ' disabled' : '';
    var backBtnHTML = '<button type="button" class="card-back-btn" id="card-back-btn"' + backDisabled + ' aria-label="Previous screen" title="Previous screen">' +
      ICON.back + '<span>Back</span></button>';

    var footHTML = '<div class="card-foot">' +
      backBtnHTML +
      '<div class="card-foot-right">' + foot + '</div>' +
    '</div>';

    var stampHTML = isReview ? '<div class="review-stamp" aria-hidden="true">' + ICON.check + '</div>' : '';
    card.innerHTML = stampHTML + '<div class="card-main">' + main + '</div>' + footHTML;
    setupActiveInteractions(s, isReview);
    afterRender(s, isReview);
  }

  function setupActiveInteractions(s, isReview) {
    // Back button inside card
    var cardBackBtn = document.getElementById('card-back-btn');
    if (cardBackBtn) {
      cardBackBtn.addEventListener('click', function () {
        advancePrev();
      });
    }

    // In review mode, the continue button advances to next step
    var reviewContinueBtn = document.getElementById('review-continue-btn');
    if (reviewContinueBtn) {
      reviewContinueBtn.addEventListener('click', function () {
        advanceNext();
      });
    }

    if (isReview) return;

    var skipBtn = document.getElementById('skip-screen-btn');
    if (skipBtn) {
      skipBtn.addEventListener('click', function () {
        s.skipped = true;
        advanceNext();
      });
    }

    if (s.type === 'quiz') {
      var optBtns = card.querySelectorAll('[data-quiz-opt]');
      optBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          currentSelectedQuiz = Number(btn.dataset.quizOpt);
          render();
        });
      });

      var confirmQuizBtn = document.getElementById('confirm-quiz-btn');
      if (confirmQuizBtn) {
        confirmQuizBtn.addEventListener('click', function () {
          if (currentSelectedQuiz === null) return;
          if (currentSelectedQuiz === s.correct) {
            s.completed = true;
            s.skipped = false;
            s.answer = currentSelectedQuiz;

            // Instant visual feedback for correct answer
            var correctBtn = card.querySelector('[data-quiz-opt="' + currentSelectedQuiz + '"]');
            if (correctBtn) {
              correctBtn.classList.add('just-correct');
            }
            confirmQuizBtn.disabled = true;
            messageEl.textContent = 'Correct! Excellent job!';

            setTimeout(function () {
              currentSelectedQuiz = null;
              advanceNext();
            }, 650);
          } else {
            var wrongBtn = card.querySelector('[data-quiz-opt="' + currentSelectedQuiz + '"]');
            if (wrongBtn) {
              wrongBtn.classList.add('wrong');
              messageEl.textContent = 'Not quite. Try another option or ask Julia for a hint!';
            }
          }
        });
      }
    }

    if (s.type === 'read') {
      var confirmReadBtn = document.getElementById('confirm-read-btn');
      if (confirmReadBtn) {
        confirmReadBtn.addEventListener('click', function () {
          s.completed = true;
          s.skipped = false;
          advanceNext();
        });
      }
    }

    if (s.type === 'input') {
      var textarea = document.getElementById('active-textarea');
      var confirmInputBtn = document.getElementById('confirm-input-btn');
      if (textarea && confirmInputBtn) {
        textarea.addEventListener('input', function () {
          currentTypedText = textarea.value;
          confirmInputBtn.disabled = (currentTypedText.trim().length === 0);
        });
        confirmInputBtn.addEventListener('click', function () {
          if (!currentTypedText.trim()) return;
          s.completed = true;
          s.skipped = false;
          s.answer = currentTypedText.trim();
          textarea.classList.add('just-correct');
          confirmInputBtn.disabled = true;
          messageEl.textContent = 'Great answer!';

          setTimeout(function () {
            currentTypedText = '';
            advanceNext();
          }, 500);
        });
      }
    }

    if (s.type === 'short') {
      var shortInput = document.getElementById('active-short');
      var confirmShortBtn = document.getElementById('confirm-short-btn');
      if (shortInput && confirmShortBtn) {
        shortInput.addEventListener('input', function () {
          currentTypedText = shortInput.value;
          confirmShortBtn.disabled = (currentTypedText.trim().length === 0);
        });
        confirmShortBtn.addEventListener('click', function () {
          if (!currentTypedText.trim()) return;
          s.completed = true;
          s.skipped = false;
          s.answer = currentTypedText.trim();
          shortInput.classList.add('just-correct');
          confirmShortBtn.disabled = true;
          messageEl.textContent = 'Great answer!';

          setTimeout(function () {
            currentTypedText = '';
            advanceNext();
          }, 500);
        });
      }
    }
  }

  function setupWatch(s, isReview) {
    var posterImg = document.getElementById("video-poster-img");
    if (posterImg) {
      posterImg.onerror = function () { this.onerror = null; this.src = IMG; };
    }
    var playBtn = document.getElementById('watch-play-btn');
    if (playBtn) {
      playBtn.addEventListener('click', function () {
        s.completed = true;
        s.skipped = false;
        messageEl.textContent = 'Video watched. You can now proceed to the next activity.';
        advanceNext();
      });
    }
  }

  function afterRender(s, isReview) {
    speakingEl.style.display = isReview ? 'none' : '';
    messageEl.textContent = isReview ? 'Ask Julia about this ' + ({ watch: 'video', read: 'text' }[s.type] || 'question') : (visited ? 'Welcome back! Let’s keep going.' : 'Talk to interrupt');

    prevBtn.disabled = (viewingScreenIndex === 0 && viewingMode === 'screen');
    nextBtn.disabled = false;
  }

  function renderTransitionCheckpoint() {
    buildSteps();
    var mi = checkpointFinishedMilestone;
    var m = milestones[mi];
    var status = getMilestoneStatus(mi);

    card.className = 'card enter';
    card.parentNode.classList.remove('watch');
    speakingEl.style.display = '';

    if (status.isAllCompleted) {
      // Trigger confetti ONLY the first time completing this milestone
      if (!milestonesCelebrated[mi]) {
        triggerConfetti();
        milestonesCelebrated[mi] = true;
      } else {
        stopConfetti();
      }
      messageEl.textContent = 'Milestone complete!';

      var nextTitle = milestones[mi + 1] ? milestones[mi + 1].title : 'Complete';

      card.innerHTML = '<div class="card-main">' +
        '<div class="milestone-summary">' +
          '<p class="eyebrow">Milestone ' + (mi + 1) + ' · Completed</p>' +
          '<h1>Milestone complete!</h1>' +
          '<p class="summary-desc">You completed all activities in ' + esc(m.title) + '.</p>' +
        '</div>' +
      '</div>' +
      '<div class="card-foot">' +
        '<button type="button" class="card-back-btn" id="checkpoint-back-btn" aria-label="Go back">' + ICON.back + '<span>Back</span></button>' +
        '<div class="card-foot-right">' +
          '<button type="button" class="cta-button" id="proceed-btn">Continue to ' + esc(nextTitle) + ' ' + ICON.arrow + '</button>' +
        '</div>' +
      '</div>';

      document.getElementById('checkpoint-back-btn').addEventListener('click', function () {
        advancePrev();
      });

      document.getElementById('proceed-btn').addEventListener('click', function () {
        stopConfetti();
        unlockNextMilestone(mi);
      });
    } else {
      stopConfetti();
      messageEl.textContent = 'Please complete the skipped questions before moving on.';

      var qWord = status.skipped === 1 ? 'question' : 'questions';

      card.innerHTML = '<div class="card-main">' +
        '<div class="milestone-summary">' +
          '<p class="eyebrow">Milestone ' + (mi + 1) + '</p>' +
          '<h1>You skipped ' + status.skipped + ' ' + qWord + '</h1>' +
          '<p class="summary-desc">Please complete all questions to finish this milestone.</p>' +
        '</div>' +
      '</div>' +
      '<div class="card-foot">' +
        '<button type="button" class="card-back-btn" id="checkpoint-back-btn" aria-label="Go back">' + ICON.back + '<span>Back</span></button>' +
        '<div class="card-foot-right">' +
          '<button type="button" class="secondary-btn" id="continue-anyway-btn">Continue anyway</button>' +
          '<button type="button" class="cta-button" id="return-to-questions-btn">Return to questions ' + ICON.arrow + '</button>' +
        '</div>' +
      '</div>';

      document.getElementById('checkpoint-back-btn').addEventListener('click', function () {
        advancePrev();
      });

      document.getElementById('return-to-questions-btn').addEventListener('click', function () {
        if (status.firstSkippedIndex !== null) {
          goToScreen(status.firstSkippedIndex);
        } else {
          goToScreen(m.screens[0].index);
        }
      });

      document.getElementById('continue-anyway-btn').addEventListener('click', function () {
        unlockNextMilestone(mi);
      });
    }

    prevBtn.disabled = false;
    nextBtn.disabled = true;
  }

  function unlockNextMilestone(mi) {
    if (mi + 1 > unlockedMilestone) {
      unlockedMilestone = mi + 1;
    }
    var nextM = milestones[mi + 1];
    if (nextM && nextM.screens.length > 0) {
      goToScreen(nextM.screens[0].index);
    } else {
      renderLessonDone();
    }
  }

  function renderLessonDone() {
    if (!lessonDoneCelebrated) {
      triggerConfetti();
      lessonDoneCelebrated = true;
    } else {
      stopConfetti();
    }

    card.className = 'card enter';
    card.innerHTML = '<div class="card-main">' +
      '<div class="milestone-summary">' +
        '<p class="eyebrow">Lesson Complete</p>' +
        '<h1>Congratulations! You finished the entire lesson!</h1>' +
        '<p class="summary-desc">You completed all milestones successfully.</p>' +
        '<div class="summary-actions">' +
          '<button type="button" class="cta-button" onclick="location.reload()">Start over</button>' +
        '</div>' +
      '</div>' +
    '</div>';
    messageEl.textContent = 'All lesson milestones completed!';
  }

  function advanceNext() {
    currentSelectedQuiz = null;
    currentTypedText = '';

    if (viewingMode === 'milestone') return;

    var currentScreen = screens[viewingScreenIndex];
    if (!currentScreen) return;

    var currentM = milestones[currentScreen.m];
    var isLastInMilestone = (currentScreen.si === currentM.screens.length - 1);

    if (isLastInMilestone) {
      viewingMode = 'milestone';
      checkpointFinishedMilestone = currentScreen.m;
      viewingCheckpointDot = currentScreen.m + 1;
      render();
    } else {
      goToScreen(viewingScreenIndex + 1);
    }
  }

  function advancePrev() {
    currentSelectedQuiz = null;
    currentTypedText = '';

    if (viewingMode === 'milestone') {
      var currentM = milestones[checkpointFinishedMilestone];
      if (currentM && currentM.screens.length > 0) {
        goToScreen(currentM.screens[currentM.screens.length - 1].index);
      }
      return;
    }

    var currentScreen = screens[viewingScreenIndex];
    if (!currentScreen) return;

    // When going back from the first screen of a milestone (si === 0),
    // show the transition checkpoint screen that preceded it!
    if (currentScreen.si === 0 && currentScreen.m > 0) {
      viewingMode = 'milestone';
      checkpointFinishedMilestone = currentScreen.m - 1;
      viewingCheckpointDot = currentScreen.m;
      render();
      return;
    }

    if (viewingScreenIndex > 0) {
      goToScreen(viewingScreenIndex - 1);
    }
  }

  function goToScreen(index) {
    index = Math.max(0, Math.min(screens.length - 1, index));
    var targetScreen = screens[index];

    if (targetScreen.m > unlockedMilestone) return;

    if (viewingScreenIndex < unlockedMilestone && index === unlockedMilestone) visited = true;

    viewingMode = 'screen';
    viewingScreenIndex = index;
    currentSelectedQuiz = null;
    currentTypedText = '';
    render();
  }

  // Confetti Engine
  var confettiId = null;
  function triggerConfetti() {
    var canvas = document.getElementById('confetti-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    var pieces = [];
    var count = 120;
    var colors = ['#006efa', '#3fbf62', '#ffd166', '#ef476f', '#118ab2', '#06d6a0', '#be50ff'];

    for (var i = 0; i < count; i++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        size: Math.random() * 10 + 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        speedY: Math.random() * 3 + 2,
        speedX: Math.random() * 2 - 1,
        rotation: Math.random() * 360,
        rotationSpeed: Math.random() * 4 - 2
      });
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(function (p) {
        p.y += p.speedY;
        p.x += p.speedX;
        p.rotation += p.rotationSpeed;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();

        if (p.y > canvas.height) {
          p.y = -20;
          p.x = Math.random() * canvas.width;
        }
      });
      confettiId = requestAnimationFrame(update);
    }

    if (confettiId) cancelAnimationFrame(confettiId);
    update();
  }

  function stopConfetti() {
    if (confettiId) {
      cancelAnimationFrame(confettiId);
      confettiId = null;
    }
    var canvas = document.getElementById('confetti-canvas');
    if (canvas) {
      var ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  // Setup Draggable Version Switcher
  function setupVersionSwitcher() {
    var switcher = document.getElementById('proto-switcher');
    var toggleBtn = document.getElementById('proto-toggle-btn');
    var header = document.getElementById('proto-switcher-header');
    var radioEn = document.getElementById('proto-mode-en');
    var radioHe = document.getElementById('proto-mode-he');
    var labelV1 = document.getElementById('opt-label-v1');
    var labelV2 = document.getElementById('opt-label-v2');

    // Draggable logic
    var isDragging = false;
    var startX = 0, startY = 0;
    var initialLeft = 0, initialTop = 0;
    var hasMoved = false;

    if (toggleBtn) {
      toggleBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        switcher.classList.toggle('is-collapsed');
      });
    }

    if (header) {
      function onPointerDown(e) {
        if (e.target.closest('#proto-toggle-btn')) return;
        isDragging = true;
        hasMoved = false;
        var clientX = e.clientX || (e.touches && e.touches[0].clientX);
        var clientY = e.clientY || (e.touches && e.touches[0].clientY);
        startX = clientX;
        startY = clientY;

        var rect = switcher.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;

        switcher.classList.add('is-dragging');
        document.addEventListener('mousemove', onPointerMove);
        document.addEventListener('mouseup', onPointerUp);
        document.addEventListener('touchmove', onPointerMove, { passive: false });
        document.addEventListener('touchend', onPointerUp);
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        var clientX = e.clientX || (e.touches && e.touches[0].clientX);
        var clientY = e.clientY || (e.touches && e.touches[0].clientY);
        var dx = clientX - startX;
        var dy = clientY - startY;

        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
          hasMoved = true;
        }

        if (hasMoved) {
          if (e.cancelable) e.preventDefault();
          var newLeft = Math.max(8, Math.min(window.innerWidth - switcher.offsetWidth - 8, initialLeft + dx));
          var newTop = Math.max(8, Math.min(window.innerHeight - switcher.offsetHeight - 8, initialTop + dy));
          switcher.style.left = newLeft + 'px';
          switcher.style.top = newTop + 'px';
          switcher.style.right = 'auto';
          switcher.style.bottom = 'auto';
        }
      }

      function onPointerUp(e) {
        if (!isDragging) return;
        isDragging = false;
        switcher.classList.remove('is-dragging');
        document.removeEventListener('mousemove', onPointerMove);
        document.removeEventListener('mouseup', onPointerUp);
        document.removeEventListener('touchmove', onPointerMove);
        document.removeEventListener('touchend', onPointerUp);

        if (!hasMoved) {
          switcher.classList.toggle('is-collapsed');
        }
      }

      header.addEventListener('mousedown', onPointerDown);
      header.addEventListener('touchstart', onPointerDown, { passive: true });
    }

    function setMode(mode) {
      protoMode = mode;
      if (mode === 'en') {
        radioEn.checked = true;
        labelV1.classList.add('active');
        labelV2.classList.remove('active');
      } else {
        radioHe.checked = true;
        labelV2.classList.add('active');
        labelV1.classList.remove('active');
      }
      render();
    }

    if (radioEn && radioHe) {
      radioEn.addEventListener('change', function () { if (radioEn.checked) setMode('en'); });
      radioHe.addEventListener('change', function () { if (radioHe.checked) setMode('he'); });
    }
  }

    prevBtn.addEventListener('click', advancePrev);
  nextBtn.addEventListener('click', advanceNext);

  document.addEventListener('keydown', function (e) {
    if (e.target.matches('input, textarea')) return;
    if (e.key === 'ArrowLeft') advancePrev();
    if (e.key === 'ArrowRight') advanceNext();
  });

  setupVersionSwitcher();
  render();
})();
</script>
</body>
</html>
